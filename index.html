<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Uploader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Upload PDF to Bucket</h1>
  <input type="file" id="fileInput" accept="application/pdf">
  <div id="output"></div>

  <script>
    document.getElementById('fileInput').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file || file.type !== 'application/pdf') {
        alert('Please upload a valid PDF file.');
        return;
      }

      const outputDiv = document.getElementById('output');
      outputDiv.innerHTML = 'Uploading...';

      try {
        const formData = new FormData();
        const uniqueFileName = `pdf-${Date.now()}.pdf`; // Unique file name

        formData.append('pdf', file);

        const response = await fetch('http://localhost:3009/upload-folder', {
          method: 'POST',
          body: formData,
        });

     

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`Upload failed: ${errorText}`);
        }

        alert('PDF uploaded successfully.');
        outputDiv.innerHTML = 'Upload complete!';
        console.log('PDF uploaded successfully.');
      } catch (error) {
        console.error('Error uploading PDF:', error);
        alert('Error uploading PDF.');
        outputDiv.innerHTML = 'Upload failed.';
      }
    });
  </script>
</body>
</html>
